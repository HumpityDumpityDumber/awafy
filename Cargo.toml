[package]
name = "awafy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytes = "1.12.1"
clap = { version = "4.6.0", features = ["derive"] }
futures-util = "0.3.34"
hex = "0.4.3"
machineid-rs = "1.2.4"
petname = "3.2.0"
rand = "0.10.3"
reqwest = { version = "0.13.2", features = ["json"] }
ringbuf = "0.5.3"
rodio = { version = "0.23.0", features = ["symphonia-aac"] }
rust_socketio = { version = "0.6.0", features = ["async"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
transmux = { version = "0.27.7", features = ["sample-aes"] }
urlencoding = "2.1.3"
